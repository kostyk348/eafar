name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (Cargo.lock is committed and dependency-free, so --locked applies)
        run: cargo build --all-targets --locked
      - name: Test
        run: cargo test
  cross-platform:
    # Non-blocking portability check: the crate is std-only, so it should
    # compile everywhere; failures here are reported but do not gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --all-targets
